<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="студент, html, frontend">
    <meta name="description" content="Сизоненко Ілля, група ІМ-43">
    <title>Сизоненко І. І., ІМ-43, ЛР-5, Варіант 53</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-wrapper">
        <form id="register-form">
            <input type="text" name="name" placeholder="ПІБ" maxlength="20">
            <input type="text" name="group" placeholder="Група">
            <input type="text" name="card" placeholder="Номер картки" maxlength="20">
            <input type="text" name="birthday" placeholder="Дата народження">
            <input type="text" name="email" placeholder="Електронна пошта" maxlength="50">
            <button type="submit">Підтвердити</button>
        </form>
        <div class="message">
            <h2>Введені дані</h2>
            <h3>Ім'я: <p id="name"></p></h3>
            <h3>Група: <p id="group"></p></h3>
            <h3>Номер картки: <p id="card"></p></h3>
            <h3>Дата народження: <p id="birthday"></p></h3>
            <h3>Електронна пошта: <p id="email"></p></h3>
        </div>
    </div>
    <div class="line-separator"></div>
    <div class="table-wrapper">
        <div class="controls">
            <input type="color" id="color-picker" value="#ff5722">
        </div>
        <table id="grid-table"></table>
    </div>
    <script src="./scripts/form.js"></script>
    <script src="./scripts/table.js"></script>
</body>
